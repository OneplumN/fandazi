server {
    listen 80;
    listen [::]:80;
    server_name malatang.oneplums.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://malatang.oneplums.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name malatang.oneplums.cn;
    ssl_certificate /etc/letsencrypt/live/malatang.oneplums.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malatang.oneplums.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /var/www/malatang.oneplums.cn/current;
    index index.html;
    access_log /var/log/nginx/malatang.access.log;
    error_log /var/log/nginx/malatang.error.log;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    # Content-addressed assets survive release switches and can be cached permanently.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|svg|ico)$" {
        root /var/www/malatang.oneplums.cn/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location /assets/ {
        root /var/www/malatang.oneplums.cn/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location /art/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # The game is self-contained. Unavailable management writes must still report failure truthfully.
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Management backend is unavailable; the game runs independently"}';
    }
    location ~ /\. { deny all; }
    location = /admin {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }
}
