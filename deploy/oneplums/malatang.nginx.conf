server {
    listen 80;
    listen [::]:80;
    server_name malatang.oneplums.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://malatang.oneplums.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name malatang.oneplums.cn;
    ssl_certificate /etc/letsencrypt/live/malatang.oneplums.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malatang.oneplums.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /var/www/malatang.oneplums.cn/current;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/malatang.access.log;
    error_log /var/log/nginx/malatang.error.log;
    gzip on; gzip_static on; gzip_vary on; gzip_min_length 1000;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    include /etc/nginx/snippets/fandazi-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
    location = /release-manifest.json { include /etc/nginx/snippets/fandazi-security.conf; return 404; }
    location ~ \.map$ { include /etc/nginx/snippets/fandazi-security.conf; return 404; }
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.js$" {
        root /var/www/malatang.oneplums.cn/shared; default_type application/javascript; types { application/javascript js br gz; }
        include /etc/nginx/snippets/fandazi-precompressed.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.css$" {
        root /var/www/malatang.oneplums.cn/shared; default_type text/css; types { text/css css br gz; }
        include /etc/nginx/snippets/fandazi-precompressed.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.svg$" {
        root /var/www/malatang.oneplums.cn/shared; default_type image/svg+xml; types { image/svg+xml svg br gz; }
        include /etc/nginx/snippets/fandazi-precompressed.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location @fandazi_plain { root /var/www/malatang.oneplums.cn/shared; gzip on; gzip_static on; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/fandazi-security.conf; add_header X-Robots-Tag "noindex, nofollow" always; }
    location /assets/ { root /var/www/malatang.oneplums.cn/shared; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/fandazi-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always; }
    location /art/ { try_files $uri =404; add_header Cache-Control "public, max-age=86400"; include /etc/nginx/snippets/fandazi-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /api/street { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; include /etc/nginx/snippets/fandazi-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /api/reviews { client_max_body_size 64k; proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; include /etc/nginx/snippets/fandazi-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always; }
    location ^~ /api/native/ { client_max_body_size 512k; proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; include /etc/nginx/snippets/fandazi-security.conf; }
    location ^~ /api/ops/ { client_max_body_size 64k; proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; add_header Cache-Control no-store always; include /etc/nginx/snippets/fandazi-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always; }
    location ^~ /api/ { default_type application/json; add_header Cache-Control no-store always; include /etc/nginx/snippets/fandazi-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always; return 503 '{"error":"Management backend unavailable"}'; }
    location ~ /\. { deny all; }
    location = /admin { add_header Cache-Control no-cache; add_header X-Robots-Tag "noindex, nofollow" always; include /etc/nginx/snippets/fandazi-security.conf; try_files /index.html =404; }
    location = /ops.html { add_header Cache-Control no-store; add_header X-Robots-Tag "noindex, nofollow" always; include /etc/nginx/snippets/fandazi-security.conf; try_files $uri =404; }
    location / { add_header Cache-Control no-cache; include /etc/nginx/snippets/fandazi-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri $uri/ =404; }
}
