# http-context maps; separate locations serve selected bytes and matching headers.
map $http_accept_encoding $fandazi_suffix {
    default "";
    "~*\\bbr\\b(?![^,]*;\\s*q=0(?:\\.0*)?(?:,|$))" .br;
    "~*\\bgzip\\b(?![^,]*;\\s*q=0(?:\\.0*)?(?:,|$))" .gz;
}
map $fandazi_suffix $fandazi_encoding {
    default "";
    .br br;
    .gz gzip;
}
