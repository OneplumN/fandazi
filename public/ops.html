<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>小馆街务</title><link rel="stylesheet" href="./ops.css"><script type="module" src="./ops.js"></script></head><body class="ops-body"><main><h1>小馆街务</h1><p>调整门牌、限定菜和搭子的闲聊，保存后街上就会更新。</p><label>管理凭证<input id="token" type="password" autocomplete="off" spellcheck="false"></label><section id="stores"></section><button id="add" type="button">添一家店</button><label>街边闲聊，一行一句<textarea id="messages" rows="5" maxlength="6000"></textarea></label><button id="save" type="button">保存街务</button><p id="status" role="status"></p><a href="./#home">回街上看看</a></main></body></html>
